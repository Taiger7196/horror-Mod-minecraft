name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: brokenscript-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Commits the built JAR into dist/ on the same branch so it can be
      # downloaded straight from the repository ([skip ci] avoids loops).
      - name: Commit JAR to dist/
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet && echo "no JAR changes" && exit 0
          git commit -m "dist: built mod JAR [skip ci]"
          git push

      # Pushing a tag (e.g. v3.0.0) publishes a GitHub release with the JAR.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" build/libs/*.jar \
            --title "Broken Script 3.0 Fan-Made — $TAG" \
            --notes "$(cat <<'EOF'
          Fan-made psychological & meta-horror mod for **Minecraft 1.21.5** (NeoForge 21.5.98+, Java 21).

          ## Installazione
          1. Installa NeoForge 21.5.98 o superiore per Minecraft 1.21.5
          2. Copia `brokenscript-3.0.0.jar` nella cartella `mods/`
          3. Avvia il gioco. Non leggere i file in `LOGS_UNCANNY/`.

          ## Contenuti
          - Sistema di infezione a 4 stadi (0-100%, salvato nel mondo, arco di 20+ ore)
          - Entità: Herobrine, Null, Entity 303/505, Lick, The Reaper
          - Meta-horror: chat/tab-list spoofing (ping 999ms), file .txt reali in LOGS_UNCANNY, inversione W/S, falsi crash, tooltip corrotti
          - Struttura Terminal Vault + quest finale "Fixing the Script" (CLI con assalti a ondate)
          - Altari di Purificazione, Croci Maledette, degradazione del mondo
          - Ogni funzione invasiva è disattivabile da config (`config/brokenscript-common.toml`)
          EOF
          )" || gh release upload "$TAG" build/libs/*.jar --clobber
