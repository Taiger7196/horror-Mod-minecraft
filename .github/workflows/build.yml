name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: brokenscript-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Commits the built JAR into dist/ on the same branch so it can be
      # downloaded straight from the repository ([skip ci] avoids loops).
      - name: Commit JAR to dist/
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet && echo "no JAR changes" && exit 0
          git commit -m "dist: built mod JAR [skip ci]"
          git push
